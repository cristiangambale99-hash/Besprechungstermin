.mgrp summary::-webkit-details-marker{display:none}
.mgrp summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--cs-fg-2);border-bottom:2px solid var(--cs-fg-2);transform:rotate(45deg);margin-left:6px;flex:0 0 auto}
.mgrp[open] summary::after{transform:rotate(-135deg)}
.mgrp[open] summary{border-bottom:1px solid var(--cs-line)}
.mgrp .mrich{padding:8px 14px}
.mrich label small{display:block;font-size:11.5px;color:var(--cs-fg-2);font-weight:400}
.xlist{border:1px solid var(--cs-line);border-radius:12px;overflow:hidden}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:var(--cs-bg-soft)}
.xrow+.xrow{border-top:1px solid var(--cs-line)}
.xrow small{display:block;color:var(--cs-fg-2);font-size:12.5px}
.zl{border:1px solid var(--cs-line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.zl.off{background:var(--cs-bg-soft)}
.zl.on{border-color:#1b8384}
.zlh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.zlh b{font-size:15px}
.zlh input{flex:1;min-width:0;min-height:42px;border:1px solid var(--cs-line-strong);border-radius:8px;padding:8px 10px;font-size:16px}
.zlo{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:2px}
.zltot{min-height:44px;display:flex;align-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.zl .seg+.seg{margin-top:10px}
.zl [data-seg^="zl_"],.zl [data-seg^="zxm_"],[data-seg="waschPro"]{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))}
.zl [data-seg^="zl_"] label,.zl [data-seg^="zxm_"] label{justify-content:center;padding:8px 6px;text-align:center}
.note{background:var(--cs-head);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--cs-fg-2)}
.pill-list{display:flex;gap:6px;flex-wrap:wrap}
/* Schritt-Anzeige nur am Handy */
.stepnow{display:none}
